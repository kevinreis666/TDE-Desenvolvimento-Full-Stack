<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Usuários - Gestão de Avaliações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Gestão de Avaliações</a>
        <div class="d-flex align-items-center text-white">
            <a href="/dashboard" class="btn btn-outline-secondary btn-sm text-white me-3">Voltar ao Painel</a>
            <span class="me-3" th:text="${nome} + ' (' + ${tipo} + ')'">Usuário</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Usuários Cadastrados</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#novoUsuarioModal">
            + Novo Usuário
        </button>
    </div>

    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Perfil</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${pagina.content}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.nome}" class="fw-semibold">Admin</td>
                        <td th:text="${u.email}">admin@email.com</td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.tipo == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'"
                                  th:text="${u.tipo}">ADMIN</span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-1"
                                    th:data-id="${u.id}"
                                    th:data-nome="${u.nome}"
                                    th:data-email="${u.email}"
                                    th:data-tipo="${u.tipo}"
                                    onclick="abrirModalEditar(this)">
                                Editar / Redefinir Senha
                            </button>
                            <form th:if="${u.id != usuarioLogadoId}"
                                  th:action="@{/usuarios/remover/{id}(id=${u.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Tem certeza que deseja remover este usuário?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pagina.content)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum usuário encontrado.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer d-flex justify-content-between align-items-center" th:if="${pagina.totalPages > 0}">
            <span class="text-muted small">
                Página <strong th:text="${pagina.page + 1}">1</strong> de <strong th:text="${pagina.totalPages}">1</strong>
                (Total: <span th:text="${pagina.totalElements}">0</span> registros)
            </span>
            <div>
                <a th:if="${pagina.page > 0}"
                   th:href="@{/usuarios(page=${pagina.page - 1}, size=${pagina.size})}"
                   class="btn btn-sm btn-outline-secondary">Anterior</a>
                <a th:if="${!pagina.last}"
                   th:href="@{/usuarios(page=${pagina.page + 1}, size=${pagina.size})}"
                   class="btn btn-sm btn-outline-secondary">Próxima</a>
            </div>
        </div>
    </div>
</div>

<!-- Modal Novo Usuário -->
<div class="modal fade" id="novoUsuarioModal" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/usuarios/criar}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Novo Usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Nome *</label>
                    <input type="text" name="nome" class="form-control" required minlength="2" maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Perfil *</label>
                    <select name="tipo" class="form-select" required>
                        <option value="AUTOR">Autor (Professor)</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha Inicial *</label>
                    <input type="password" name="senha" class="form-control" required minlength="6">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Editar Usuário / Resetar Senha -->
<div class="modal fade" id="editarUsuarioModal" tabindex="-1">
    <div class="modal-dialog">
        <form id="formEditarUsuario" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Usuário</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Nome *</label>
                    <input type="text" name="nome" id="editNome" class="form-control" required minlength="2" maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail *</label>
                    <input type="email" name="email" id="editEmail" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Perfil *</label>
                    <select name="tipo" id="editTipo" class="form-select" required>
                        <option value="AUTOR">Autor (Professor)</option>
                        <option value="ADMIN">Administrador</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Redefinir Senha (opcional)</label>
                    <input type="password" name="novaSenha" class="form-control" minlength="6"
                           placeholder="Deixe em branco para manter a senha atual">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const editModal = new bootstrap.Modal(document.getElementById('editarUsuarioModal'));

    function abrirModalEditar(btn) {
        const id = btn.getAttribute('data-id');
        document.getElementById('formEditarUsuario').action = '/usuarios/editar/' + id;
        document.getElementById('editNome').value = btn.getAttribute('data-nome');
        document.getElementById('editEmail').value = btn.getAttribute('data-email');
        document.getElementById('editTipo').value = btn.getAttribute('data-tipo');
        editModal.show();
    }
</script>
</body>
</html>
