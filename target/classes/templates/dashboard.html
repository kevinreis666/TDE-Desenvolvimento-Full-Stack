<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel - Gestão de Avaliações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Gestão de Avaliações</a>
        <div class="d-flex align-items-center text-white">
            <a href="/usuarios/perfil" class="btn btn-outline-info btn-sm me-3">Meu Perfil</a>
            <span class="me-3" th:text="${nome} + ' (' + ${tipo} + ')'">Usuário</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Cursos</h5>
                    <p class="card-text text-muted flex-grow-1">Visualizar e gerenciar os cursos cadastrados no sistema.</p>
                    <a href="/cursos" class="btn btn-primary">Acessar Cursos</a>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Disciplinas</h5>
                    <p class="card-text text-muted flex-grow-1">Visualizar, filtrar por curso e gerenciar disciplinas.</p>
                    <a href="/disciplinas" class="btn btn-primary">Acessar Disciplinas</a>
                </div>
            </div>
        </div>

        <div class="col-md-4" th:if="${tipo == 'ADMIN'}">
            <div class="card shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">Usuários</h5>
                    <p class="card-text text-muted flex-grow-1">Gerenciar administradores, autores e redefinir senhas.</p>
                    <a href="/usuarios" class="btn btn-primary">Acessar Usuários</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
