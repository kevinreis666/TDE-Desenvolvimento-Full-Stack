<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil - Gestão de Avaliações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">Gestão de Avaliações</a>
        <div class="d-flex align-items-center text-white">
            <a href="/dashboard" class="btn btn-outline-secondary btn-sm text-white me-3">Voltar ao Painel</a>
            <span class="me-3" th:text="${nome} + ' (' + ${tipo} + ')'">Usuário</span>
            <a href="/logout" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Meu Perfil</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/usuarios/perfil}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" name="nome" class="form-control" th:value="${usuario.nome}" required minlength="2" maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control" th:value="${usuario.email}" required>
                        </div>

                        <hr class="my-4">
                        <h6 class="text-muted mb-3">Alterar Senha (preencha apenas se desejar trocar)</h6>

                        <div class="mb-3">
                            <label class="form-label">Senha Atual</label>
                            <input type="password" name="senhaAntiga" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nova Senha</label>
                            <input type="password" name="novaSenha" class="form-control" minlength="6">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
